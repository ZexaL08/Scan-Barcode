<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Barcode</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; margin: 0; padding: 0; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 400px; background: white; min-height: 100vh; padding: 20px; position: relative; }
    
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; font-size: 14px; }
    label span { color: #007bff; }
    
    input[type="text"] {
      width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; background: white;
    }
    
    .barcode-input-container { position: relative; display: flex; align-items: center; }
    .barcode-input-container input { padding-right: 45px; }
    .scan-icon-btn {
      position: absolute; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer; color: #555;
    }

    #scanner-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; flex-direction: column;
    }
    #reader { width: 90%; max-width: 350px; background: white; border-radius: 8px; overflow: hidden; }
    .close-modal { margin-top: 15px; padding: 10px 20px; background: #ff4d4d; color: white; border: none; border-radius: 6px; font-weight: bold; }

    .bottom-actions {
      display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;
    }
    .btn-cancel { background: none; border: none; color: #666; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-save { background: none; border: none; color: #007bff; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <form id="mainForm">

    <div class="form-group">
      <label>Diinput Oleh <span>*</span></label>
      <input type="text" id="diinputOleh" placeholder="Masukkan Nama Petugas" required>
    </div>

    <div class="form-group">
      <label>Kode Barcode / No Chasis <span>*</span></label>
      <div class="barcode-input-container">
        <input type="text" id="noChasis" placeholder="Scan atau ketik..." required>
        <button type="button" class="scan-icon-btn" onclick="openScanner()">📷</button>
      </div>
    </div>

    <div class="bottom-actions">
      <button type="button" class="btn-cancel" onclick="resetForm()">Cancel</button>
      <button type="submit" class="btn-save">Save</button>
    </div>

  </form>
</div>

<div id="scanner-modal">
  <div id="reader"></div>
  <button class="close-modal" onclick="closeScanner()">Tutup Scanner</button>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyftaYqUFKALas4Er3MUIf0XW5ipbZ6YLyTM1qntXPZSoVll12YWaORYbUVa1TOz75V/exec";
  let html5QrcodeScanner;

  window.onload = function() {
    const savedName = localStorage.getItem("saved_diinputOleh");
    if (savedName) {
      document.getElementById('diinputOleh').value = savedName;
    }
  };

  function openScanner() {
    document.getElementById('scanner-modal').style.display = 'flex';
    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
    html5QrcodeScanner.render((decodedText) => {
      document.getElementById('noChasis').value = decodedText;
      closeScanner();
    });
  }

  function closeScanner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.clear();
    }
    document.getElementById('scanner-modal').style.display = 'none';
  }

  function resetForm() {
    document.getElementById('mainForm').reset();
    localStorage.removeItem("saved_diinputOleh");
  }

  document.getElementById('mainForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const diinputOlehVal = document.getElementById('diinputOleh').value;
    const noChasisVal = document.getElementById('noChasis').value;

    localStorage.setItem("saved_diinputOleh", diinputOlehVal);

    const formData = {
      diinputOleh: diinputOlehVal,
      noChasis: noChasisVal
    };

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formData)
    })
    .then(() => {
      alert("Data berhasil dikirim!");
      document.getElementById('noChasis').value = "";
    })
    .catch(error => alert("Gagal mengirim data: " + error));
  });
</script>

</body>
</html>
